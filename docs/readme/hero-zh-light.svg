<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="316" viewBox="0 0 1200 316" role="img" aria-labelledby="glance-title glance-desc">
  <title id="glance-title">Glance</title>
  <desc id="glance-desc">Glance，Windows 系统监控：把鼠标推到屏幕边缘，面板就会滑出。名字旁边是面板的 CPU 一栏：占用 48%、曲线、频率、功耗和每个线程。</desc>
  <rect width="1200" height="316" rx="14" fill="#F1F0EE"/>
  <g transform="translate(64 96.64) scale(0.0586)">
    <rect x="64" y="64" width="896" height="896" rx="208" fill="#14231F"/>
    <path d="M176 640 L336 640 L432 400 L544 720 L640 304 L720 560 L848 560" fill="none" stroke="#E6EDE6" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="848" cy="560" r="56" fill="#FF7B4A"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Roboto, Arial, sans-serif">
    <text x="64" y="70" font-size="20" font-weight="600" letter-spacing="3.4" fill="#8B8985">WINDOWS · 系统监控</text>
    <text x="140" y="154" font-size="76" font-weight="600" letter-spacing="-1.6" fill="#2B2A27">Glance</text>
    <text x="64" y="202" font-size="26" fill="#2B2A27">把鼠标推到屏幕边缘，</text>
    <text x="64" y="236" font-size="26" fill="#2B2A27">电脑此刻的状态一目了然。</text>
    <text x="64" y="278" font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, Consolas, Menlo, monospace" font-size="19" fill="#8B8985">Windows 10 / 11 · 64 位 · MIT</text>
    <text x="656" y="70" font-size="20" font-weight="600" letter-spacing="3.4" fill="#8B8985">在屏幕边缘</text>
  </g>
  <rect x="656" y="88" width="480" height="188" rx="12" fill="#FFFFFF" stroke="#E8E7E5" stroke-width="1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, Roboto, Arial, sans-serif">
