[package]
name = "glance-remote"
version = "0.4.3"
license = "MIT"
edition = "2021"
description = "Glance's remote control helper: what a paired phone may ask of this PC. Runs as the user, never elevated."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The requests are signed with a key shared at pairing (HMAC-SHA256).
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
# The pairing code, shown as a QR code.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media_Control",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Display",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
