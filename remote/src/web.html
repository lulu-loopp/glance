<!doctype html>
<html lang="zh">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glance">
<meta name="theme-color" content="#0e1116">
<title>Glance</title>
<style>
/* The phone app's look, plainly: dark and flat, 16 from the sides, 16 inside a card, 12 between cards; nothing pressed smaller than 44. */
:root { color-scheme: dark; --ground: #0e1116; --card: #171b22; --card2: #20252d; --line: #2b313b; --ink: #f2f4f7; --dim: #98a2ae; --faint: #5b6470; --accent: #ff7b4a; --lit: #2a1d17; --good: #58c98b; --bad: #f0685d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body { padding: calc(12px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card, .tile { min-width: 0; }
[hidden] { display: none !important; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 0; }
header strong { font-size: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header small { color: var(--dim); font-size: 13px; white-space: nowrap; }
header small::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 8px; }
header small.good::before { background: var(--good); } header small.bad::before { background: var(--bad); }
.card { background: var(--card); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.card > h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--dim); display: flex; justify-content: space-between; align-items: center; min-height: 20px; }
.note { color: var(--dim); font-size: 14px; }
.tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.tile { font: inherit; text-align: left; color: var(--ink); background: var(--card); border: 0; border-radius: 20px; padding: 16px; min-height: 84px; display: grid; gap: 6px; align-content: center; }
.tile.wide { grid-column: 1 / -1; }
.tile b { font-size: 17px; font-weight: 600; } .tile small { color: var(--dim); font-size: 12.5px; }
.tile.on { background: var(--lit); } .tile.on b { color: var(--accent); }
.rig { padding: 8px 8px 12px; gap: 8px; }
.rig svg { display: block; width: 100%; height: auto; }
.rig .reads { padding: 0 4px; }
@keyframes turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none !important; } }
.reads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.reads div { background: var(--card2); border-radius: 12px; padding: 8px; min-height: 52px; }
.reads b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; } .reads small { color: var(--dim); font-size: 11px; white-space: nowrap; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chips button { font: inherit; font-size: 13.5px; color: var(--dim); background: var(--card2); border: 0; border-radius: 99px; height: 36px; padding: 0 14px; white-space: nowrap; flex: none; }
.chips button.on { background: var(--ink); color: #000; font-weight: 600; }
.swatches button { width: 36px; padding: 0; background: var(--c); }
.swatches button.on { background: var(--c); box-shadow: inset 0 0 0 3px var(--c), inset 0 0 0 6px var(--card); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; }
.row + .row, .row + .slide { border-top: 0; } .rows > * + .row { border-top: 1px solid var(--line); padding-top: 8px; }
.row b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row small { color: var(--dim); font-size: 12.5px; }
.switch { width: 50px; height: 30px; border-radius: 99px; border: 0; background: #353c47; position: relative; padding: 0; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .16s; }
.switch.on { background: var(--accent); } .switch.on::after { transform: translateX(20px); } .switch:disabled { opacity: .4; }
.slide { display: grid; grid-template-columns: minmax(0, 1fr) 3em; gap: 12px; align-items: center; min-height: 32px; }
.slide output { text-align: right; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 99px; margin: 10px 0; background: linear-gradient(90deg, var(--accent) var(--at, 0%), var(--card2) var(--at, 0%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 1px 4px #0009; }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; }
.keys { display: flex; gap: 4px; } .keys button, .text { font: inherit; color: var(--ink); background: none; border: 0; min-width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center; }
.note.small { font-size: 12px; color: var(--faint); }
.keys button.main { background: var(--card2); } .text { color: var(--dim); font-size: 13px; border-radius: 12px; height: 32px; }
.app { color: var(--ink); text-decoration: none; gap: 4px; } .app b { color: var(--accent); font-weight: 600; }
.ask { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; padding: 24px; }
.ask div { background: var(--card2); border-radius: 24px; padding: 24px 24px 12px; max-width: 328px; display: grid; gap: 12px; }
.ask h3 { margin: 0; font-size: 19px; } .ask p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.6; }
.ask nav { display: flex; justify-content: flex-end; gap: 8px; } .ask nav button { font: inherit; font-weight: 600; background: none; border: 0; color: var(--dim); height: 44px; padding: 0 12px; } .ask nav .do { color: var(--bad); }
/* Files to and from the PC: a button as the app's (a pill, 44 high), what is typed in a well of the card's second shade, how far a sending is as a line under it. */
.go { font: inherit; font-weight: 600; color: var(--ink); background: var(--card2); border: 0; border-radius: 99px; min-height: 44px; padding: 0 18px; text-decoration: none; display: inline-grid; place-items: center; white-space: nowrap; }
.go.main { background: var(--accent); color: #1a0d07; } .go:disabled { opacity: .4; }
textarea { font: inherit; color: var(--ink); background: var(--card2); border: 0; border-radius: 12px; padding: 12px; min-height: 88px; resize: vertical; width: 100%; }
textarea::placeholder { color: var(--faint); }
.ends { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; } .ends .note { margin-right: auto; }
.bar { height: 4px; border-radius: 99px; background: var(--card2); overflow: hidden; } .bar i { display: block; height: 100%; width: var(--done, 0%); background: var(--accent); transition: width .2s; }
.thing { display: grid; gap: 8px; } .thing img { max-width: 100%; max-height: 320px; border-radius: 12px; justify-self: start; }
.thing p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; } .thing a.link { color: var(--accent); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header><strong id="name">Glance</strong><small id="status"></small></header>
<div class="card" id="unpaired" hidden><b id="unpaired-title"></b><span class="note" id="unpaired-how"></span></div>
<div class="card rig" id="rig" hidden><div id="rig-drawing"></div><div class="reads" id="rig-reads"></div></div>
<main id="main" hidden></main>
<section class="card" id="came" hidden><h2 id="came-title"></h2><div class="rows" id="came-list"></div><div class="bar" id="came-bar" hidden><i></i></div><div class="ends"><span class="note" id="came-said"></span><button class="text" type="button" id="came-refuse"></button><button class="go main" type="button" id="came-take"></button><button class="go" type="button" id="came-close"></button></div></section>
<section class="card" id="send" hidden><h2 id="send-title"></h2><textarea id="words"></textarea><div class="bar" id="send-bar" hidden><i></i></div><div class="ends"><span class="note" id="send-said"></span><button class="text" type="button" id="send-cancel"></button><button class="go" type="button" id="send-pick"></button><button class="go main" type="button" id="send-words"></button></div><input type="file" id="send-files" multiple hidden></section>
<a class="card app" id="app" href="https://glancepc.com/app" hidden><b id="app-title"></b><span class="note" id="app-how"></span></a>
<script>
"use strict";
// ---- words, in the phone's language
const ZH = (navigator.language || "").toLowerCase().startsWith("zh");
const t = (zh, en) => ZH ? zh : en;
document.documentElement.lang = ZH ? "zh" : "en";

// ---- SHA-256 and HMAC, written out: a page not served over HTTPS is given none by the browser
const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes) {
  const h = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const length = bytes.length, whole = ((length + 9 + 63) >> 6) << 6, m = new Uint8Array(whole), view = new DataView(m.buffer), w = new Uint32Array(64);
  m.set(bytes); m[length] = 0x80; view.setUint32(whole - 8, Math.floor(length / 0x20000000)); view.setUint32(whole - 4, (length << 3) >>> 0);
  const r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < whole; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = view.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) w[i] = (w[i - 16] + (r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3)) + w[i - 7] + (r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10))) >>> 0;
    let [a, b, c, d, e, f, g, k] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (k + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      k = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0] += a; h[1] += b; h[2] += c; h[3] += d; h[4] += e; h[5] += f; h[6] += g; h[7] += k;
  }
  const out = new Uint8Array(32), to = new DataView(out.buffer);
  h.forEach((x, i) => to.setUint32(i * 4, x));
  return out;
}
const joined = (a, b) => { const all = new Uint8Array(a.length + b.length); all.set(a); all.set(b, a.length); return all; };
function hmac(key, message) {
  const inner = new Uint8Array(64).fill(0x36), outer = new Uint8Array(64).fill(0x5c);
  (key.length > 64 ? sha256(key) : key).forEach((b, i) => { inner[i] ^= b; outer[i] ^= b; });
  return sha256(joined(outer, sha256(joined(inner, message))));
}
const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
const unhex = text => new Uint8Array(text.match(/../g).map(pair => parseInt(pair, 16)));
const random = n => { const bytes = new Uint8Array(n); (self.crypto || self.msCrypto).getRandomValues(bytes); return hex(bytes); };

// ---- what this browser keeps: the key the PC offered it (from the link it was opened by: after the #, which is never sent), and a number of its own
const kept = { get: name => { try { return localStorage.getItem(name); } catch (e) { return null; } }, set: (name, value) => { try { localStorage.setItem(name, value); } catch (e) {} } };
const offered = /[#&]k=([0-9a-f]{64})/.exec(location.hash);
if (offered) { kept.set("key", offered[1]); history.replaceState(null, "", location.pathname); }
const key = kept.get("key");
let phone = kept.get("phone");
if (!phone) { phone = random(16); kept.set("phone", phone); }
const called = /iPhone|iPad/.test(navigator.userAgent) ? (/iPad/.test(navigator.userAgent) ? "iPad" : "iPhone") : /Android/.test(navigator.userAgent) ? "Android" : "Browser";

// ---- asking the PC: signed, as the app signs (over what is asked, when, by which browser, for which run of the PC's helper, and a number used once); the PC signs its answer in turn, and none that is not signed is believed
// What the PC said of itself when it last refused a request as not of now: which run of its helper it is, and how far its clock is from this one's (seconds).
const told = { session: "", ahead: 0 };
const encoder = new TextEncoder();
const signed = (parts, body) => hex(hmac(unhex(key), joined(encoder.encode(parts.map(part => part + "\n").join("")), body)));
// What is asked is JSON, or bytes as they are (a piece of a file sent: see `send`). The answer is JSON, or where `bytes` is asked, bytes (a piece of a file the PC sends: see `take`).
async function ask(path, body, again = true, bytes = false) {
  const method = body ? "POST" : "GET", sent = body instanceof Uint8Array ? body : encoder.encode(body ? JSON.stringify(body) : ""), time = String(Math.floor(Date.now() / 1000) + told.ahead), nonce = random(8), name = encodeURIComponent(called + " (web)");
  const sign = signed([method, path, time, nonce, phone, name, told.session], sent);
  const answer = await fetch(path, { method, body: body ? sent : undefined, cache: "no-store", headers: { "X-Glance-Time": time, "X-Glance-Nonce": nonce, "X-Glance-Sign": sign, "X-Glance-Session": told.session, "X-Glance-Phone": phone, "X-Glance-Name": name, "X-Glance-Browser": "1" } });
  const got = new Uint8Array(await answer.arrayBuffer());
  const own = signed(["answer", nonce, String(answer.status)], got) === answer.headers.get("X-Glance-Sign");
  let json = {};
  if (!bytes || !answer.ok) try { json = JSON.parse(new TextDecoder().decode(got)); } catch (e) {}
  // (Refused by one that does not know the key: there is nothing it could sign with. Whatever else is not signed is not the PC's.)
  if (!own) throw Object.assign(new Error(answer.status === 401 ? "forged" : "unsigned"), { status: answer.status === 401 ? 401 : 0 });
  // Not of now, as the PC has it: asked again, for the run it says it is and by its clock.
  if (answer.status === 401 && json.error === "stale" && again) {
    told.session = String(json.session || ""); told.ahead = (Number(json.time) || 0) - Math.floor(Date.now() / 1000);
    return ask(path, body, false, bytes);
  }
  if (!answer.ok) throw Object.assign(new Error(json.error || String(answer.status)), { status: answer.status });
  return bytes ? got : json;
}
// The same, asked again where the network let it down (not where the PC answered): a piece sent or fetched twice is taken once.
async function askAgain(path, body, bytes) {
  for (let tries = 1; ; tries++) {
    try { return await ask(path, body, true, bytes); }
    catch (error) { if (error.status || tries === 3) throw error; await new Promise(done => setTimeout(done, 800 * tries)); }
  }
}

// ---- the page
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; if (tag === "button") e.type = "button"; return e; };
const main = document.getElementById("main"), status = document.getElementById("status");
let state = null, busy = 0, holding = false, question = null;
const said = (text, kind) => { status.textContent = text; status.className = kind || ""; };

// What is asked shows at once as it will be; the PC's answer then says how it is.
async function act(path, body, expect) {
  if (expect && state) { expect(state); draw(); }
  busy++;
  try { state = await ask(path, body); said(t("已连接", "Connected"), "good"); }
  catch (error) { failed(error); }
  busy--; draw();
}
function failed(error) {
  if (error.status === 401) { said(t("需要重新配对", "Pair again"), "bad"); unpaired(t("电脑已不再信任此浏览器", "The PC no longer trusts this browser")); }
  else said(error.status ? t("操作未完成", "Not completed") : t("无法连接", "Can't connect"), "bad");
}
function unpaired(title) {
  main.hidden = true;
  document.getElementById("rig").hidden = true;
  document.getElementById("send").hidden = document.getElementById("came").hidden = true;
  document.getElementById("unpaired").hidden = false;
  document.getElementById("unpaired-title").textContent = title;
  document.getElementById("unpaired-how").textContent = t("在电脑的 Glance 设置中打开“设备”页，用相机扫描其中的配对码。", "On the PC, open the Devices page in Glance Settings and scan the pairing code there with the camera.");
}

const EFFECTS = [["steady", t("常亮", "Steady")], ["breathing", t("呼吸", "Breathing")], ["rainbow", t("彩虹", "Rainbow")], ["heat", t("跟随温度", "By heat")]];
const COLOURS = ["FF7B4A", "FFFFFF", "70B3FF", "59C98A", "C68CFF", "FF5E7E"];
const MODES = { efficiency: t("最佳能效", "Best efficiency"), balanced: t("平衡", "Balanced"), performance: t("最佳性能", "Best performance") };

// The signs on what is pressed, drawn (as the app draws them): paths on a square of 24.
const SIGNS = { play: "M8 5.5v13l11-6.5z", pause: "M8 5v14M16 5v14", previous: "M18 6v12l-9-6zM6.5 6v12", next: "M6 6v12l9-6zM17.5 6v12" };
function sign_of(name) {
  const NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg"), path = document.createElementNS(NS, "path");
  for (const [k, v] of Object.entries({ viewBox: "0 0 24 24", width: 22, height: 22, fill: "none", stroke: "currentColor", "stroke-width": 1.7, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" })) svg.setAttribute(k, v);
  path.setAttribute("d", SIGNS[name]); svg.append(path);
  return svg;
}
function tile(title, detail, on, press, wide) { const b = el("button", "tile" + (on ? " on" : "") + (wide ? " wide" : "")); b.append(el("b", "", title), el("small", "", detail)); b.onclick = press; return b; }
function chips(list, cls) { const row = el("div", "chips" + (cls ? " " + cls : "")); for (const [text, on, press, colour] of list) { const b = el("button", on ? "on" : "", text); if (colour) b.style.setProperty("--c", "#" + colour); b.onclick = press; row.append(b); } return row; }
function toggle(on, enabled, press) { const b = el("button", "switch" + (on ? " on" : "")); b.disabled = !enabled; b.setAttribute("role", "switch"); b.setAttribute("aria-checked", on); b.onclick = () => press(!on); return b; }
// A line slid: the figure follows the finger; the PC is asked when it is let go.
function slide(value, least, enabled, done) {
  const row = el("div", "slide"), input = el("input"), out = el("output", "", value + "%");
  input.type = "range"; input.min = least; input.max = 100; input.value = value; input.disabled = !enabled;
  const fill = () => input.style.setProperty("--at", ((input.value - least) / (100 - least) * 100) + "%");
  fill();
  input.oninput = () => { holding = true; out.textContent = input.value + "%"; fill(); };
  input.onchange = () => { holding = false; done(+input.value); };
  row.append(input, out);
  return row;
}
function card(title, right) { const c = el("div", "card"), h = el("h2", "", title); if (right) h.append(right); c.append(h); return c; }

function draw() {
  if (!state) return;
  transferDrawn();
  // (Not under a finger that is sliding something, nor under a question.)
  if (holding) return;
  document.getElementById("name").textContent = state.name || "Glance";
  main.hidden = false; main.textContent = "";
  // The remote off on the PC (it runs for nearby sharing alone): nothing of it to show or press, files still sent.
  if (state.remote === false) {
    document.getElementById("rig").hidden = true;
    const c = card(t("手机遥控已关闭", "Phone remote is off"));
    c.append(el("span", "note", t("电脑已关闭手机遥控，仍可在此与电脑互传文件。", "Phone remote is off on the PC. Files can still be sent here.")));
    main.append(c);
    return;
  }
  const night = state.night, screen = state.screen !== false, lights = state.lights;
  const reads = state.reads;
  // The PC drawn, and under it what its parts read (none, where Glance is not running there to read them).
  document.getElementById("rig").hidden = false;
  drawn(state);
  const row = document.getElementById("rig-reads");
  row.textContent = "";
  row.hidden = !reads;
  if (reads) {
    for (const [id, name] of [["cpu", "CPU"], ["gpu", t("显卡", "Graphics")], ["ram", t("内存", "Memory")], ["disk", t("硬盘", "Disk")]]) {
      const read = reads[id] || {}, box = el("div");
      box.append(el("b", "", read.temp != null ? read.temp + "°" : read.load != null ? read.load + "%" : "—"), el("small", "", read.temp != null && read.load != null ? `${name} ${read.load}%` : name));
      row.append(box);
    }
  }
  // A phone the PC lets only read how it is: shown so, with nothing to press.

        if (sending.stop) throw new Error("cancelled");
        const piece = new Uint8Array(await file.slice(from, from + PIECE).arrayBuffer());
        await askAgain(`/v1/send/piece?s=${sending.session}&f=${begun.files[at]}&at=${from}`, piece);
        from += piece.length; done += piece.length;
        bar("send-bar", done, total);
        sendSaid(t(`正在发送 ${Math.floor(done / (total || 1) * 100)}%`, `Sending ${Math.floor(done / (total || 1) * 100)}%`));
        if (!file.size) break;
      }
    }
    sendSaid(t(`已发送 ${files.length} 个文件`, plural(files.length, "Sent 1 file", `Sent ${files.length} files`)));
  } catch (error) {
    if (sending.session) ask("/v1/send/cancel", { session: sending.session }).catch(() => {});
    sendSaid(error.message === "cancelled" ? t("已取消发送", "Sending canceled") : why(error));
  } finally {
    sending.going = false;
    bar("send-bar", 0, null);
    sendDrawn();
  }
}

// What the PC sends here: shown as it is offered, fetched once it is taken, each file then to be saved (a picture shown too). Words come whole with the offer.
const came = { job: null, files: [], urls: {}, taking: false, over: false, closed: false };
function copy(text, button) {
  const copied = () => { button.textContent = t("已复制", "Copied"); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(copied, () => {}); return; }
  // (A page not served over HTTPS has no clipboard of its own: what is copied is selected and copied as by hand.)
  const area = el("textarea");
  area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
  document.body.append(area); area.select(); area.setSelectionRange(0, text.length);
  if (document.execCommand("copy")) copied();
  area.remove();
}
function cameDrawn() {
  const offer = state && state.incoming;
  if (offer && offer.job !== came.job) {
    Object.values(came.urls).forEach(url => URL.revokeObjectURL(url));
    Object.assign(came, { job: offer.job, files: offer.files || [], urls: {}, taking: false, over: false, closed: false });
    $("came-said").textContent = "";
    cameListed();
  }
  const files = came.files.filter(file => file.words == null), taken = files.every(file => came.urls[file.id]);
  $("came").hidden = came.job == null || came.closed;
  $("came-take").hidden = $("came-refuse").hidden = !files.length || taken || came.over;
  $("came-take").disabled = $("came-refuse").disabled = came.taking;
  $("came-close").hidden = !(taken || came.over) || came.taking;
}
function cameListed() {
  const list = $("came-list");
  list.textContent = "";
  const words = came.files.filter(file => file.words != null), files = came.files.filter(file => file.words == null);
  $("came-title").textContent = files.length ? t(`电脑发来 ${files.length} 个文件`, plural(files.length, "1 file from the PC", `${files.length} files from the PC`)) : t("电脑发来的文字", "Text from the PC");
  for (const file of words) {
    const row = el("div", "row"), thing = el("div", "thing"), button = el("button", "text", t("复制", "Copy"));
    thing.append(/^https?:\/\/\S+$/.test(file.words.trim()) ? Object.assign(el("a", "link", file.words.trim()), { href: file.words.trim(), target: "_blank", rel: "noopener" }) : el("p", "", file.words));
    button.onclick = () => copy(file.words, button);
    row.append(thing, button); list.append(row);
  }
  for (const file of files) {
    const row = el("div", "row"), thing = el("div", "thing"), url = came.urls[file.id];
    const text = el("div");
    text.append(el("b", "", file.name.split("/").pop()), el("small", "", sized(file.size)));
    thing.append(text);
    if (url && /^image\//.test(file.type)) thing.append(Object.assign(el("img"), { src: url, alt: file.name }));
    row.append(thing);
    if (url) row.append(Object.assign(el("a", "go", t("保存", "Save")), { href: url, download: file.name.split("/").pop() }));
    list.append(row);
  }
  if (files.some(file => came.urls[file.id] && /^image\//.test(file.type)) && /iPhone|iPad/.test(navigator.userAgent)) list.append(el("span", "note small", t("长按图片可存储到照片。", "Touch and hold a picture to save it to Photos.")));
}
async function take() {
  came.taking = true;
  cameDrawn();
  const job = came.job, files = came.files.filter(file => file.words == null), total = files.reduce((sum, file) => sum + file.size, 0);
  let done = 0;
  bar("came-bar", 0, total);
  try {
    for (const file of files) {
      const parts = [];
      for (let at = 0; at < file.size; ) {
        const piece = await askAgain("/v1/take/piece", { job, file: file.id, at }, true);
        if (!piece.length) throw Object.assign(new Error("short"), { status: 500 });
        parts.push(piece); at += piece.length; done += piece.length;
        bar("came-bar", done, total);
        $("came-said").textContent = t(`正在接收 ${Math.floor(done / (total || 1) * 100)}%`, `Receiving ${Math.floor(done / (total || 1) * 100)}%`);
      }
      came.urls[file.id] = URL.createObjectURL(new Blob(parts, { type: file.type || "application/octet-stream" }));
    }
    $("came-said").textContent = "";
  } catch (error) {
    came.over = true;
    $("came-said").textContent = error.status === 404 || error.status === 410 ? t("电脑已取消发送", "The PC canceled sending") : error.status ? t("接收失败", "Couldn't receive") : t("无法连接", "Can't connect");
  }
  came.taking = false;
  bar("came-bar", 0, null);
  cameListed();
  cameDrawn();
}

function transferDrawn() { sendDrawn(); cameDrawn(); }
$("send-title").textContent = t("发送到电脑", "Send to PC");
$("words").placeholder = t("输入要发送的文字", "Text to send");
$("send-pick").textContent = t("选择照片或文件", "Choose photos or files");
$("send-words").textContent = t("发送文字", "Send text");
$("send-cancel").textContent = t("取消", "Cancel");
$("send-pick").onclick = () => $("send-files").click();
$("send-files").onchange = () => { const files = Array.from($("send-files").files || []); $("send-files").value = ""; if (files.length) send(files, null); };
$("send-words").onclick = () => { const words = $("words").value; if (words.trim()) send([], words); };
$("send-cancel").onclick = () => { sending.stop = true; };
$("came-take").textContent = t("接收", "Receive");
$("came-refuse").textContent = t("拒绝", "Decline");
$("came-close").textContent = t("关闭", "Close");
$("came-take").onclick = take;
$("came-refuse").onclick = () => { came.over = true; came.closed = true; cameDrawn(); ask("/v1/take/refuse", { job: came.job }).catch(() => {}); };
$("came-close").onclick = () => { came.closed = true; cameDrawn(); };

// ---- how the PC is, asked while the page is looked at
async function look() {
  if (busy || document.hidden) return;
  try { const answer = await ask("/v1/state"); if (!busy) { state = answer; said(t("已连接", "Connected"), "good"); draw(); } }
  catch (error) { if (!busy) failed(error); }
}
// The app, offered to an Android phone (it has what a page cannot: sharing from other apps, finding the PC where its address changed).
if (/Android/.test(navigator.userAgent)) {
  document.getElementById("app").hidden = false;
  document.getElementById("app-title").textContent = t("下载 Glance APP", "Get the Glance app");
  document.getElementById("app-how").textContent = t("安装后可从相册或其他应用直接分享到电脑，电脑地址变化时也能自动找到。", "With the app, you can share to the PC from Photos or any other app, and it finds the PC when its address changes.");
}
if (!key) { said(""); unpaired(t("此浏览器尚未与电脑配对", "This browser is not paired with the PC")); }
else { said(t("正在连接…", "Connecting…")); look(); setInterval(look, 2000); document.addEventListener("visibilitychange", look); }
</script>
