[package]
name = "glance"
version = "0.2.5"
license = "MIT"
edition = "2021"

[lib]
name = "glance_lib"
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "3"

[features]
# The studio: the panel drawn off screen, frame by frame, for the video
# and the README (glance --studio script.json out-folder). Not shipped.
studio = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS's own APIs: the kernel's counters, and IOKit for drives, graphics,
# sensors and power.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.7"
objc2-core-foundation = "0.3"
objc2-io-kit = "0.3"

# Windows' own APIs: everything Glance does there, and only there.
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
# For `#[implement]`: the effects handed to Windows' compositor.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_Graphics_Direct3D",
    "Foundation",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Devices_DeviceAndDriverInstallation",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_EventLog",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_WindowsProgramming",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
