[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# For trying a change on this PC: as the release, optimised, but built in parts and again only where they changed
# (`cargo build --profile fast`, into target/fast). Releases are built as above.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
