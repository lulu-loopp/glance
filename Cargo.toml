[package]
name = "glance"
version = "0.4.3"
license = "MIT"
edition = "2021"
# `cargo run` runs Glance itself; its sensors (src/bin/glance-sensors.rs) are started by it.
default-run = "glance"

[lib]
name = "glance_lib"
crate-type = ["rlib"]

[build-dependencies]
embed-resource = "3"

[features]
# The studio: the panel drawn off screen, frame by frame, for the video
# and the README (glance --studio script.json out-folder). Not shipped.
studio = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Notes' Markdown, parsed as they are written (to show it as it will read).
pulldown-cmark = { version = "0.13", default-features = false }
# What is pasted into a note as HTML (a web page's, Word's), read as a browser reads it, to be written as Markdown.
html5ever = "0.39"
markup5ever_rcdom = "=0.39.0+unofficial"
# Inflating what is deflated (zlib): Kugou's lyrics come so.
miniz_oxide = "0.9"

# macOS's own APIs: the kernel's counters, and IOKit for drives, graphics,
# sensors and power.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.7"
objc2-core-foundation = "0.3"
objc2-io-kit = "0.3"

# Windows' own APIs: everything Glance does there, and only there.
[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"
# For `#[implement]`: the effects handed to Windows' compositor.
windows-core = "0.62"

